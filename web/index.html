<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sitserve · Vipassana courses</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f1e5;
    --fg: #463a2e;
    --muted: #7a6955;
    --faint: #a28e75;
    --line: #e4d9c8;
    --hover: #f0e7d8;
    --control-bg: #fcf7ed;
    --control-border: #d8c8b1;
    --icon-hover: #eae0cf;
    --header-bg: #eae0cf;
    --header-fg: #6d563d;
    --header-line: #d6c4a9;
    --hl: rgba(133, 91, 48, .09);
    --notes-bg: #f3ebdd;
    --notes-fg: #604e3c;
    --popover-bg: #fcf7ed;
    --popover-shadow: 0 10px 30px rgba(70, 48, 27, .18), 0 0 0 1px rgba(70, 48, 27, .08);
    --photo-bg: #eae0cf;
    --open: #2f9e44;
    --wait: #f0b400;
    --long-wait: #f76707;
    --closed: #d94a4a;
    --unknown: #b8bec9;
    --noncenter: #228be6;
    --link: #855b30;
    --search-pending-bg: #f3c16b;
    --search-pending-fg: #50320b;
    --search-pending-border: #cc963d;
    --search-warning: #865f10;
    --long-fg: #805d8b;
    --long-bg: #eee3ed;
    --regular-fg: #74614e;
    --regular-bg: #fcf7ed;
    --special-fg: #426e60;
    --special-bg: #e5ece0;
    --regular-tint-a: #faf6ef;
    --regular-tint-b: #e9d6bd;
    --regular-solid-a: #846546;
    --regular-solid-b: #523525;
    --regular-ink: #5c412c;
    --special-tint-a: #e6f7ed;
    --special-tint-b: #b1dfc5;
    --special-solid-a: #35775d;
    --special-solid-b: #0b4834;
    --special-ink: #16513c;
    --long-tint-a: #faedfa;
    --long-tint-b: #d9bae7;
    --long-solid-a: #8050a0;
    --long-solid-b: #3e256e;
    --long-ink: #562b71;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #211c18;
    --fg: #e8dcc8;
    --muted: #b5a28a;
    --faint: #8f7b63;
    --line: #382e25;
    --hover: #2b231d;
    --control-bg: #2b231d;
    --control-border: #514132;
    --icon-hover: #3c3025;
    --header-bg: #30271f;
    --header-fg: #decbb0;
    --header-line: #514132;
    --hl: rgba(213, 174, 124, .12);
    --notes-bg: #28211b;
    --notes-fg: #d1bea3;
    --popover-bg: #30271f;
    --popover-shadow: 0 10px 30px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .07);
    --photo-bg: #3c3025;
    --open: #40c057;
    --wait: #fcc419;
    --long-wait: #ff922b;
    --closed: #e26060;
    --unknown: #4f5764;
    --noncenter: #4dabf7;
    --link: #d5ae7c;
    --search-pending-bg: #d6a14a;
    --search-pending-fg: #23190b;
    --search-pending-border: #e0ad58;
    --search-warning: #f2c55c;
    --long-fg: #ceb0d2;
    --long-bg: #392c38;
    --regular-fg: #cbb79c;
    --regular-bg: #2b231d;
    --special-fg: #a8c6ad;
    --special-bg: #26332a;
    --regular-tint-a: #2a241f;
    --regular-tint-b: #46372a;
    --regular-solid-a: #ae8b63;
    --regular-solid-b: #dcc8a6;
    --regular-ink: #dfcfb4;
    --special-tint-a: #1c2a22;
    --special-tint-b: #244534;
    --special-solid-a: #579d79;
    --special-solid-b: #9dd3b5;
    --special-ink: #b0dec4;
    --long-tint-a: #2d2230;
    --long-tint-b: #4b355b;
    --long-solid-a: #9f76cb;
    --long-solid-b: #dab3ed;
    --long-ink: #e3c4f1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }

  /* Filter bar. The heading (wheel, collapsed summary, tools) and the panel share one grid cell, so
     the open controls' first row sits beside the wheel and tools, and collapsing leaves the heading. */
  .bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  #filters { --brand-w: 30px; --tools-w: 68px; --edge-gap: 10px; display: grid; max-width: 1180px; margin: 0 auto; padding: 8px 16px; }
  .filter-heading, #filter-panel { grid-area: 1 / 1; min-width: 0; }
  .filter-heading { display: flex; align-self: start; align-items: center; gap: var(--edge-gap); min-height: 30px; }
  #filters[data-collapsed=true] .filter-heading { cursor: pointer; }
  .brand, .filter-tools { position: relative; z-index: 1; }
  .brand { display: grid; flex: none; place-items: center; width: var(--brand-w); height: 30px; }
  .brand img { display: block; width: 21px; height: 30px; }
  .mode { position: absolute; top: 0; right: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--search-pending-bg); box-shadow: 0 0 0 2px var(--bg); }
  .filter-tools { display: flex; flex: none; align-items: center; gap: 8px; margin-left: auto; }
  /* The panel passes clicks through to the summary beneath it; its controls still receive them. */
  #filter-panel { height: auto; pointer-events: none; }
  #filter-panel[data-animating=true] { overflow: hidden; }
  #filters[data-collapsed=true] #filter-panel { height: 0; overflow: hidden; }
  #filter-controls { pointer-events: auto; }
  .filter-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .filter-more { flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; padding-left: calc(var(--brand-w) + var(--edge-gap)); }
  .filter-sep { flex: none; width: 1px; height: 16px; background: var(--line); }
  #filter-summary { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; width: 0; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: var(--control-border) transparent; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 240ms ease; }
  #filters[data-collapsed=true] #filter-summary { opacity: 1; pointer-events: auto; }
  #filter-summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .filter-group { display: inline-flex; flex: none; align-items: center; gap: 4px; }
  .filter-group + .filter-group { padding-left: 8px; border-left: 1px solid var(--line); }
  .filter-token { display: inline-flex; flex: none; align-items: center; gap: 5px; min-height: 24px; padding: 2px 8px; border: 1px solid transparent; border-radius: 5px; color: var(--muted); font-size: 11.5px; line-height: 18px; }
  .filter-token svg { flex: none; width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .filter-token.place { border-radius: 12px; background: var(--icon-hover); color: var(--fg); }
  .filter-token.date { border-color: var(--control-border); background: var(--control-bg); color: var(--link); font-variant-numeric: tabular-nums; }
  .filter-token.course { padding: 2px 7px; font-weight: 600; }
  .filter-token.course.regular { border-color: var(--control-border); background: var(--regular-bg); color: var(--regular-fg); }
  .filter-token.course.long { background: var(--long-bg); color: var(--long-fg); }
  .filter-token.course.special { background: var(--special-bg); color: var(--special-fg); }
  .filter-token.option { min-height: 22px; padding: 1px 5px; font-size: 11px; }
  #filter-toggle { display: grid; flex: none; place-items: center; width: 30px; height: 28px; padding: 0; border: 1px solid var(--control-border); border-radius: 6px; background: var(--control-bg); color: var(--muted); cursor: pointer; }
  #filter-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #filter-toggle:hover { background: var(--hover); border-color: var(--muted); }
  #filter-toggle:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .field { position: relative; display: inline-flex; flex: none; align-items: center; gap: 6px; min-width: 0; height: 30px; padding: 0 8px; border: 1px solid var(--control-border); border-radius: 6px; background: var(--control-bg); color: var(--fg); font-size: 13px; }
  .field:focus-within, .place-values:focus-within { outline: 2px solid var(--link); outline-offset: 1px; }
  .field svg, .place-values > svg { flex: none; width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--faint); pointer-events: none; }
  .field .chevron { width: 12px; height: 12px; }
  .field input, .field select { min-width: 0; height: 28px; padding: 0; border: 0; outline: 0; background: none; color: inherit; font: inherit; }
  .field label { flex: none; color: var(--muted); }
  .from-filter { cursor: pointer; }
  .from-filter input { width: 96px; font-variant-numeric: tabular-nums; }
  .from-filter input::-webkit-calendar-picker-indicator { display: none; }
  .as-filter { padding: 0; }
  .as-filter svg { position: absolute; left: 8px; }
  .as-filter .chevron { left: auto; right: 7px; }
  .as-filter select { appearance: none; padding: 0 25px 0 29px; cursor: pointer; field-sizing: content; }
  /* Language shows only its code, or nothing for any language; the transparent select on top opens the list. */
  .lang-filter { gap: 4px; padding: 0 7px; }
  .lang-filter select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .where-filter { flex: 1 1 260px; min-width: 0; margin-left: calc(var(--brand-w) + var(--edge-gap)); }
  .where-box { position: relative; width: 100%; min-width: 0; }
  .place-values { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 30px; padding: 3px 4px 3px 8px; border: 1px solid var(--control-border); border-radius: 6px; background: var(--control-bg); cursor: text; }
  .place-values > svg { margin-right: 2px; }
  #place-chips { display: contents; }
  #place-search { flex: 1; width: 150px; min-width: 90px; height: 22px; padding: 0 2px; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; }
  .place-chip { display: inline-flex; align-items: center; gap: 3px; min-width: 0; max-width: 100%; padding-left: 7px; border-radius: 4px; background: var(--icon-hover); color: var(--fg); font-size: 12px; }
  .place-chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place-remove { flex: none; width: 22px; height: 22px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
  .place-remove:hover { color: var(--fg); background: var(--hover); }
  .place-options { position: absolute; top: calc(100% + 5px); left: 0; z-index: 20; width: max(100%, 380px); max-width: calc(100vw - 32px); max-height: min(360px, 60vh); overflow-y: auto; overscroll-behavior: contain; padding: 5px; border-radius: 8px; background: var(--popover-bg); box-shadow: var(--popover-shadow); color: var(--fg); }
  .place-group { padding: 8px 7px 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .place-option { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 7px; border-radius: 4px; cursor: pointer; }
  .place-option[aria-selected=true] { background: var(--hl); }
  .place-option > span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .place-tag { flex: none; color: var(--muted); font-size: 10.5px; text-align: right; }
  .place-more, .place-empty { padding: 4px 7px 7px; color: var(--muted); font-size: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; height: 24px; padding: 0 8px; border: 1px solid var(--control-border); border-radius: 12px; background: var(--control-bg); color: var(--fg); font-size: 12px; line-height: 22px; white-space: nowrap; cursor: pointer; }
  .chip input:checked + span { border-color: var(--link); background: var(--link); color: var(--bg); }
  .chip.regular span { color: var(--regular-fg); background: var(--regular-bg); }
  .chip.long span { color: var(--long-fg); background: var(--long-bg); border-color: transparent; }
  .chip.special span { color: var(--special-fg); background: var(--special-bg); border-color: transparent; }
  .chip.regular input:checked + span { background: var(--regular-fg); color: var(--bg); }
  .chip.long input:checked + span { background: var(--long-fg); color: var(--bg); }
  .chip.special input:checked + span { background: var(--special-fg); color: var(--bg); }
  .chip input:focus-visible + span { outline: 2px solid var(--link); outline-offset: 1px; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; cursor: pointer; }
  .check:hover { color: var(--fg); }
  .check input { margin: 0; accent-color: var(--link); }
  #search { display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 7px; max-width: 100%; height: 30px; padding: 0 12px; border: 1px solid var(--search-border, var(--link)); border-radius: 6px; background: var(--search-bg, var(--link)); color: var(--search-fg, var(--bg)); font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  #search svg { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #search[data-state="complete"] { --search-border: var(--control-border); --search-bg: var(--control-bg); --search-fg: var(--muted); }
  #search[data-state="pending"] { --search-border: var(--search-pending-border); --search-bg: var(--search-pending-bg); --search-fg: var(--search-pending-fg); }
  #search[data-state="loading"] svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #search:disabled { cursor: progress; opacity: .75; }
  #search:hover { filter: brightness(.92); }
  #search[data-state="complete"]:hover { border-color: var(--muted); background: var(--hover); color: var(--fg); filter: none; }
  #search:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .filter-main #search { margin-right: calc(var(--tools-w) + var(--edge-gap)); }
  #theme { display: grid; flex: none; place-items: center; width: 30px; height: 28px; padding: 0; border: 1px solid var(--control-border); border-radius: 6px; background: var(--control-bg); color: var(--muted); cursor: pointer; }
  #theme:hover { color: var(--fg); }
  #theme svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* Summary and legend */
  .summary { max-width: 1180px; margin: 0 auto; padding: 12px 24px 4px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; color: var(--muted); font-size: 13px; }
  .summary b { color: var(--fg); }
  .result-limit { flex-basis: 100%; }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .sep { width: 1px; height: 12px; background: var(--line); }
  .search-state { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  #checked { color: var(--faint); font-size: 11.5px; }
  #search-status { display: inline-flex; align-items: center; gap: 6px; }
  #search-status[data-state="pending"] { color: var(--search-warning); }
  #search-status svg { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #cancel { padding: 0; border: 0; background: none; color: var(--link); font: inherit; font-weight: 600; cursor: pointer; }
  #cancel:hover { text-decoration: underline; text-underline-offset: 3px; }
  #cancel:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 2px; }

  /* Course list: one grid row per course */
  main { max-width: 1180px; margin: 0 auto; padding: 0 16px 32px; }
  .row { display: grid; grid-template-columns: var(--columns, minmax(0, 1fr) 120px 84px 108px 84px 48px); align-items: center; column-gap: 10px; min-height: 32px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .row:not(.head):hover { background: var(--hover); }
  .head { position: sticky; top: calc(var(--bar-h, 0px) - 1px); z-index: 5; min-height: 44px; padding-top: 7px; padding-bottom: 7px; border-bottom-color: var(--header-line); background: var(--header-bg); box-shadow: 0 0 0 100vmax var(--header-bg); clip-path: inset(0 -100vmax); color: var(--header-fg); }
  .head::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--header-line); box-shadow: 0 0 0 100vmax var(--header-line); clip-path: inset(0 -100vmax); pointer-events: none; }
  .head .l, .head b { cursor: help; }
  .column-head { position: relative; display: flex; align-items: center; min-width: 0; min-height: 28px; padding: 2px 0; border: 0; border-radius: 3px; background: transparent; color: inherit; font: inherit; font-size: 10.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; text-align: left; cursor: grab; }
  .column-head + .column-head::before { content: ''; position: absolute; left: -5px; top: 4px; bottom: 4px; width: 1px; background: var(--header-line); }
  .column-head:hover { color: var(--fg); }
  .column-head:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .column-head[data-column=type], .column-head[data-column=apply], .column-head[data-column=links] { justify-content: center; }
  .column-head.dragging { opacity: .35; }
  .column-head[data-drop=before] { box-shadow: -3px 0 var(--link); }
  .column-head[data-drop=after] { box-shadow: 3px 0 var(--link); }
  h2 { position: sticky; top: calc(var(--bar-h, 0px) + var(--head-h, 0px) - 2px); z-index: 4; margin: 0; padding: 14px 8px 5px; background: var(--bg); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  h2 .count { display: inline-block; min-width: 24px; margin-left: 8px; padding: 0 6px; border-radius: 9px; background: var(--header-bg); color: var(--muted); font-size: 10px; font-weight: 500; line-height: 16px; text-align: center; vertical-align: 1px; }

  .flag { display: grid; place-items: center; flex: none; width: 16px; height: 12px; transform: translateY(1px); overflow: hidden; border-radius: 2px; outline: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); outline-offset: -1px; background: var(--photo-bg); opacity: .78; filter: saturate(.75); cursor: default; }
  .flag:hover { opacity: 1; filter: none; }
  .flag img { display: block; width: 100%; height: 100%; }
  .who { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: inherit; text-decoration: none; }
  a.name:hover { text-decoration: underline; text-underline-offset: 3px; }
  .kind { display: inline-block; flex: none; width: 5px; height: 5px; border-radius: 50%; opacity: .5; }
  .kind.noncenter { background: var(--noncenter); }
  .dates { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dates .end { opacity: .4; }
  .type { display: flex; align-items: center; justify-content: center; min-width: 0; color: var(--muted); font-size: 12px; }
  .type > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-code { display: inline-block; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px; line-height: 16px; }
  /* Result badges. Within a color group, types in filter order run from light tints to solid
     fills (--shade picks a point on each), so like-colored types such as 20D and 60D stand apart. */
  .type-code { background: color-mix(in oklch, var(--tint-a), var(--tint-b) calc(var(--shade, 0) * 100%)); color: var(--ink); }
  .type-code.solid { background: color-mix(in oklch, var(--solid-a), var(--solid-b) calc(var(--shade, 0) * 100%)); color: var(--bg); }
  .type-code.regular { --tint-a: var(--regular-tint-a); --tint-b: var(--regular-tint-b); --solid-a: var(--regular-solid-a); --solid-b: var(--regular-solid-b); --ink: var(--regular-ink); }
  .type-code.regular:not(.solid) { border-color: var(--control-border); }
  .type-code.special { --tint-a: var(--special-tint-a); --tint-b: var(--special-tint-b); --solid-a: var(--special-solid-a); --solid-b: var(--special-solid-b); --ink: var(--special-ink); }
  .type-code.long { --tint-a: var(--long-tint-a); --tint-b: var(--long-tint-b); --solid-a: var(--long-solid-a); --solid-b: var(--long-solid-b); --ink: var(--long-ink); }

  .links { display: grid; grid-template-columns: 22px 22px; gap: 4px; }
  .icon { display: grid; flex: none; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--faint); cursor: pointer; }
  .icon:hover, .icon[aria-expanded=true] { background: var(--icon-hover); color: var(--fg); }
  .icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .reg { display: grid; justify-items: center; white-space: nowrap; font-size: 13px; }
  .reg a, .reg button { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 24px; padding: 0 10px; border: 1px solid color-mix(in srgb, var(--link) 22%, var(--bg)); border-radius: 6px; background: color-mix(in srgb, var(--link) 6%, var(--bg)); color: var(--link); font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1; text-decoration: none; }
  .reg a:hover { border-color: color-mix(in srgb, var(--link) 45%, var(--bg)); background: color-mix(in srgb, var(--link) 12%, var(--bg)); }
  .reg a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .reg .opens { border-color: var(--control-border); background: var(--hover); color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; pointer-events: none; }

  /* Status lights: new, old and server groups, each with a male and a female column */
  .lights { display: flex; gap: 12px; align-self: stretch; }
  .grp { display: grid; grid-template-columns: 13px 13px; column-gap: 2px; }
  .head .grp { row-gap: 2px; }
  .head .grp b { grid-column: 1 / -1; padding-bottom: 2px; border-bottom: 1px solid var(--header-line); font-size: 9px; font-weight: 650; line-height: 11px; text-align: center; }
  .head .l { border-radius: 3px; color: var(--muted); font-size: 10px; line-height: 12px; }
  .l { display: grid; place-items: center; text-align: center; }
  i.light { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; color: var(--unknown); background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .3), transparent 65%), currentColor; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12), 0 0 0 2px color-mix(in srgb, currentColor 10%, transparent); }
  i.g { color: var(--open); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1), 0 0 0 2px color-mix(in srgb, currentColor 20%, transparent); }
  i.y { color: var(--wait); }
  i.o { color: var(--long-wait); }
  i.r { color: var(--closed); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
  #list[data-as]:not([data-as=any]) .l:not(.hl) i.light { opacity: .28; }
  .l.hl i.light { width: 10px; height: 10px; }

  /* Notes */
  .notes { padding: 8px 12px 10px 38px; border-bottom: 1px solid var(--line); background: var(--notes-bg); color: var(--notes-fg); font-size: 13px; }
  .notes .meta { margin-bottom: 4px; color: var(--muted); font-size: 12px; }
  .notes p { margin: 0 0 4px; }
  .notes a { color: var(--link); }

  .empty { padding: 40px 8px; color: var(--muted); text-align: center; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 24px 32px; color: var(--faint); font-size: 12px; text-align: center; }
  footer p { margin: 0; }
  #usage { margin-top: 4px; font-variant-numeric: tabular-nums; }
  #usage:empty { display: none; }

  /* Photo shown while hovering a location's name */
  #photo { position: fixed; z-index: 30; padding: 6px; border-radius: 10px; background: var(--popover-bg); box-shadow: var(--popover-shadow); pointer-events: none; }
  #photo img { display: block; width: 284px; height: 200px; border-radius: 6px; background: var(--photo-bg); object-fit: cover; }
  #photo div { max-width: 284px; padding: 6px 2px 1px; font-size: 12.5px; }
  #photo span { color: var(--muted); }

  /* Location shown while hovering a flag */
  #tip { position: fixed; z-index: 30; max-width: min(340px, calc(100vw - 16px)); overflow-wrap: anywhere; white-space: pre-line; padding: 4px 8px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 12.5px; pointer-events: none; }

  /* Narrow screens: name on the first line, details on the second, lights (labelled) on the third */
  @media (max-width: 820px) {
    .bar { position: static; }
    .filter-heading { flex-wrap: wrap; }
    #filter-summary { order: 1; flex-basis: 100%; width: 100%; max-height: 0; margin-top: 0; transition: max-height 280ms ease, margin-top 280ms ease, opacity 240ms ease; }
    #filters[data-collapsed=true] #filter-summary { max-height: 34px; margin-top: 6px; opacity: 1; }
    /* Where shares the first line with the wheel and tools; Search ends the controls. */
    #filter-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-row { display: contents; }
    .where-filter { flex-basis: calc(100% - var(--brand-w) - var(--tools-w) - 2 * var(--edge-gap)); margin-right: calc(var(--tools-w) + var(--edge-gap)); }
    .from-filter, .as-filter { flex: 1 1 auto; }
    .from-filter input { flex: 1; }
    .as-filter select { flex: 1 1 auto; }
    #types { order: 1; flex-basis: 100%; }
    .filter-sep { display: none; }
    .check { order: 2; }
    .filter-main #search { order: 3; flex-basis: 100%; height: 34px; margin-right: 0; }
    .place-options { width: 100%; }
    .head { display: none; }
    h2 { top: 0; }
    .row { grid-template-columns: minmax(0, 1fr) 70px auto; grid-template-areas: "location location location" "dates type apply" "lights lights links"; gap: 6px 8px; padding: 8px; }
    [data-column=location] { grid-area: location; } [data-column=dates] { grid-area: dates; } [data-column=type] { grid-area: type; }
    [data-column=links] { grid-area: links; justify-self: end; } [data-column=apply] { grid-area: apply; justify-self: end; }
    [data-column=lights] { grid-area: lights; }
    .lights { gap: 10px; align-self: auto; flex-wrap: wrap; }
    .grp { display: flex; gap: 8px; }
    .l { display: inline-flex; gap: 4px; font-size: 11px; color: var(--muted); }
    .l:not(:empty)::after { content: attr(data-k); }
    .notes { padding-left: 12px; }
  }
  @media (max-width: 380px) {
    .row { grid-template-areas: "location location location" "dates type apply" "lights lights lights" ". . links"; }
  }
  @media (prefers-reduced-motion: reduce) {
    #filter-summary { transition: none; }
    #search[data-state="loading"] svg { animation: none; }
  }
</style>
<script>
  // Set the theme before the page paints: the viewer's last choice, else the system's.
  {
    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch { /* storage blocked: follow the system */ }
    document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
</script>
</head>
<body>
<div class="bar">
  <form id="filters" autocomplete="off">
    <div class="filter-heading">
    <span class="brand" role="img" aria-label="sitserve" data-tip="sitserve"><img src="assets/wheel/dhamma-wheel.svg" alt="" width="21" height="30"><span id="mode" class="mode" data-tip="Simulated data" hidden><span class="sr-only">simulated data</span></span></span>
    <span id="filter-summary" role="region" aria-label="Selected filters" aria-hidden="true" tabindex="-1" hidden></span>
    <div class="filter-tools">
      <button type="button" id="filter-toggle" aria-label="Hide filters" data-tip="Hide filters" aria-expanded="true" aria-controls="filter-controls"></button>
      <button type="button" id="theme"></button>
    </div>
    </div>
    <div id="filter-panel">
    <div id="filter-controls">
    <div class="filter-row filter-main">
    <div class="where-filter"><label for="place-search" class="sr-only">Where</label>
      <div class="where-box" id="where-box">
        <input type="hidden" name="where">
        <span class="place-values"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="place-chips"></span><input type="search" id="place-search" placeholder="country, state or center" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="place-options" spellcheck="false"></span>
        <div class="place-options" id="place-options" role="listbox" aria-label="Places" hidden></div>
      </div>
    </div>
    <span class="field from-filter" data-tip="Courses starting on or after this date"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><label for="from" class="sr-only">From</label><input type="date" name="from" id="from"></span>
    <span class="field as-filter" data-tip="Applying as"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg><select name="as" id="as" aria-label="Applying as">
        <option value="any">Anyone</option>
        <option value="NM">New male</option>
        <option value="NF">New female</option>
        <option value="OM">Old male</option>
        <option value="OF">Old female</option>
        <option value="SM">Server, male</option>
        <option value="SF">Server, female</option>
      </select><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
    <span class="field lang-filter" data-tip="Any language"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg><span id="lang-code" aria-hidden="true"></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><select name="lang" id="lang" aria-label="Language"></select></span>
    <button type="submit" id="search" data-state="initial" aria-describedby="search-status">Search</button>
    </div>
    <div class="filter-row filter-more">
    <span class="chips" id="types" role="group" aria-label="Course types"></span>
    <span class="filter-sep"></span>
    <label class="check"><input type="checkbox" name="wait" checked> Wait lists</label>
    <label class="check"><input type="checkbox" name="soon" checked> Not open yet</label>
    <label class="check"><input type="checkbox" name="centers"> Centers only</label>
    </div>
    </div>
    </div>
  </form>
</div>

<div class="summary" hidden>
  <span id="summary" role="status"></span>
  <span class="legend">
    <span><i class="kind noncenter"></i>non-center</span>
    <span class="sep"></span>
    <span><i class="light g"></i>open</span>
    <span><i class="light y"></i>wait list</span>
    <span><i class="light o"></i>long wait list</span>
    <span><i class="light r"></i>closed</span>
  </span>
  <span class="search-state"><span id="search-status" role="status"></span><button type="button" id="cancel" hidden>Cancel</button><span id="checked"></span></span>
  <span id="search-limit" class="result-limit" hidden></span>
</div>
<div id="place-status" class="sr-only" role="status"></div>
<div id="column-status" class="sr-only" role="status"></div>
<main id="list"></main>
<footer hidden>
  <p>Course information from dhamma.org. Submit Search to check availability.</p>
  <p id="usage"></p>
</footer>

<div id="photo" hidden><img alt=""><div></div></div>
<div id="tip" hidden></div>

<script type="module" src="app.js"></script>

</body>
</html>
