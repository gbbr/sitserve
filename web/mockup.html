<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sit · Vipassana courses (mockup)</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff;
    --fg: #1f2633;
    --muted: #6b7383;
    --faint: #a0a7b4;
    --line: #e8ebf0;
    --hover: #f5f7fa;
    --control-bg: #fff;
    --control-border: #d6dbe3;
    --icon-hover: #e9edf3;
    --hl: rgba(32, 89, 201, .07);
    --notes-bg: #fafbfc;
    --notes-fg: #3a4252;
    --popover-bg: #fff;
    --popover-shadow: 0 10px 30px rgba(20, 30, 50, .2), 0 0 0 1px rgba(20, 30, 50, .06);
    --photo-bg: #eef1f5;
    --open: #2f9e44;
    --wait: #f0b400;
    --long-wait: #f76707;
    --closed: #d94a4a;
    --unknown: #b8bec9;
    --noncenter: #228be6;
    --link: #2059c9;
    --long-fg: #7351a8;
    --long-bg: #f1ecf8;
    --regular-fg: #586171;
    --regular-bg: #fff;
    --special-fg: #287b7a;
    --special-bg: #e8f4f2;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14171c;
    --fg: #e3e6eb;
    --muted: #98a1b0;
    --faint: #687180;
    --line: #262b33;
    --hover: #1b1f26;
    --control-bg: #1b1f26;
    --control-border: #353c48;
    --icon-hover: #2a3039;
    --hl: rgba(122, 167, 255, .13);
    --notes-bg: #181c22;
    --notes-fg: #c8cdd6;
    --popover-bg: #20252d;
    --popover-shadow: 0 10px 30px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .07);
    --photo-bg: #2a3039;
    --open: #40c057;
    --wait: #fcc419;
    --long-wait: #ff922b;
    --closed: #e26060;
    --unknown: #4f5764;
    --noncenter: #4dabf7;
    --link: #7aa7ff;
    --long-fg: #c4a7ee;
    --long-bg: #2b2338;
    --regular-fg: #b4bdca;
    --regular-bg: #1b1f26;
    --special-fg: #85cec8;
    --special-bg: #1c3334;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }

  /* Filter bar */
  .bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  #filters { position: relative; max-width: 1180px; margin: 0 auto; padding: 10px 62px 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
  .brand { font-weight: 700; font-size: 17px; }
  .brand small { margin-left: 6px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; font-weight: 400; color: var(--muted); vertical-align: 2px; }
  .f { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; color: var(--muted); font-size: 13px; }
  .f input:not([type=checkbox]), .f select, .f button { height: 28px; padding: 0 6px; border: 1px solid var(--control-border); border-radius: 6px; background: var(--control-bg); color: var(--fg); font: inherit; }
  .f > label, .f > .filter-label { flex: none; }
  .where-box { position: relative; width: 300px; max-width: 100%; min-width: 0; }
  .place-values { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 28px; padding: 3px 5px; border: 1px solid var(--control-border); border-radius: 6px; background: var(--control-bg); }
  .place-values:focus-within { outline: 2px solid var(--link); outline-offset: 1px; }
  #place-chips { display: contents; }
  .f #place-search { flex: 1; width: 150px; min-width: 100px; height: 22px; padding: 0 2px; border: 0; outline: 0; background: transparent; }
  .place-chip { display: inline-flex; align-items: center; gap: 3px; min-width: 0; max-width: 100%; padding-left: 7px; border-radius: 4px; background: var(--icon-hover); color: var(--fg); font-size: 12px; }
  .place-chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f .place-remove { flex: none; width: 22px; height: 22px; padding: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
  .f .place-remove:hover { color: var(--fg); background: var(--hover); }
  .place-options { position: absolute; top: calc(100% + 5px); left: 0; z-index: 20; width: max(100%, 380px); max-width: calc(100vw - 32px); max-height: min(360px, 60vh); overflow-y: auto; overscroll-behavior: contain; padding: 5px; border-radius: 8px; background: var(--popover-bg); box-shadow: var(--popover-shadow); color: var(--fg); }
  .place-group { padding: 8px 7px 3px; color: var(--muted); font-size: 11px; font-weight: 600; }
  .place-option { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 7px; border-radius: 4px; cursor: pointer; }
  .place-option[aria-selected=true] { background: var(--hl); }
  .place-option > span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .place-tag { flex: none; color: var(--muted); font-size: 10.5px; text-align: right; }
  .place-more, .place-empty { padding: 4px 7px 7px; color: var(--muted); font-size: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip span { display: block; height: 24px; padding: 0 8px; border: 1px solid var(--control-border); border-radius: 12px; background: var(--control-bg); color: var(--fg); font-size: 12px; line-height: 22px; white-space: nowrap; cursor: pointer; }
  .chip input:checked + span { border-color: var(--link); background: var(--link); color: var(--bg); }
  .chip input:focus-visible + span { outline: 2px solid var(--link); outline-offset: 1px; }
  .f input[type=checkbox] { margin: 0; }
  #theme { position: absolute; top: 10px; right: 16px; display: grid; place-items: center; width: 30px; height: 28px; padding: 0; border: 1px solid var(--control-border); border-radius: 6px; background: var(--control-bg); color: var(--muted); cursor: pointer; }
  #theme:hover { color: var(--fg); }
  #theme svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  /* Summary and legend */
  .summary { max-width: 1180px; margin: 0 auto; padding: 12px 24px 4px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; color: var(--muted); font-size: 13px; }
  .summary b { color: var(--fg); }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .sep { width: 1px; height: 12px; background: var(--line); }

  /* Course list: one grid row per course */
  main { max-width: 1180px; margin: 0 auto; padding: 0 16px 32px; }
  .row { display: grid; grid-template-columns: var(--columns, minmax(0, 1fr) 120px 84px 108px 84px 48px); align-items: center; column-gap: 10px; min-height: 32px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .row:not(.head):hover { background: var(--hover); }
  .head { position: sticky; top: calc(var(--bar-h, 0px) - 1px); z-index: 5; align-items: end; padding-top: 6px; padding-bottom: 4px; background: var(--bg); color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .head .l, .head b { cursor: help; }
  .column-head { position: relative; display: flex; align-items: end; min-width: 0; padding: 2px 0; border: 0; border-radius: 2px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: grab; }
  .column-head:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .column-head[data-column=type], .column-head[data-column=apply], .column-head[data-column=links] { justify-content: center; }
  .column-head.dragging { opacity: .35; }
  .column-head[data-drop=before] { box-shadow: -3px 0 var(--link); }
  .column-head[data-drop=after] { box-shadow: 3px 0 var(--link); }
  h2 { position: sticky; top: calc(var(--bar-h, 0px) + var(--head-h, 0px) - 2px); z-index: 4; margin: 0; padding: 14px 8px 5px; background: var(--bg); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
  h2 .count { margin-left: 8px; font-weight: 400; color: var(--faint); }

  .flag { display: grid; place-items: center; flex: none; width: 16px; height: 16px; overflow: hidden; border-radius: 2px; outline: 1px solid color-mix(in srgb, var(--fg) 12%, transparent); outline-offset: -1px; background: var(--photo-bg); opacity: .78; filter: saturate(.75); cursor: default; }
  .flag:hover { opacity: 1; filter: none; }
  .flag img { display: block; width: 100%; height: 100%; }
  .who { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .name { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: inherit; text-decoration: none; }
  a.name:hover { text-decoration: underline; text-underline-offset: 3px; }
  .kind { display: inline-block; flex: none; width: 5px; height: 5px; border-radius: 50%; opacity: .5; }
  .kind.noncenter { background: var(--noncenter); }
  .dates { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dates .end { opacity: .4; }
  .type { display: flex; align-items: center; justify-content: center; min-width: 0; color: var(--muted); font-size: 12px; }
  .type > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .type-code { display: inline-block; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px; line-height: 16px; }
  .type-code.regular { background: var(--regular-bg); color: var(--regular-fg); border-color: var(--control-border); }
  .type-code.long { background: var(--long-bg); color: var(--long-fg); }
  .type-code.special { background: var(--special-bg); color: var(--special-fg); }
  .chip.regular span { color: var(--regular-fg); background: var(--regular-bg); }
  .chip.long span { color: var(--long-fg); background: var(--long-bg); border-color: transparent; }
  .chip.special span { color: var(--special-fg); background: var(--special-bg); border-color: transparent; }
  .chip.regular input:checked + span { background: var(--regular-fg); color: var(--bg); }
  .chip.long input:checked + span { background: var(--long-fg); color: var(--bg); }
  .chip.special input:checked + span { background: var(--special-fg); color: var(--bg); }

  .links { display: grid; grid-template-columns: 22px 22px; gap: 4px; }
  .icon { display: grid; flex: none; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--faint); cursor: pointer; }
  .icon:hover, .icon[aria-expanded=true] { background: var(--icon-hover); color: var(--fg); }
  .icon svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .reg { display: grid; justify-items: center; white-space: nowrap; font-size: 13px; }
  .reg a { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 24px; padding: 0 10px; border: 1px solid color-mix(in srgb, var(--link) 22%, var(--bg)); border-radius: 6px; background: color-mix(in srgb, var(--link) 6%, var(--bg)); color: var(--link); font-size: 12px; font-weight: 600; line-height: 1; text-decoration: none; }
  .reg a:hover { border-color: color-mix(in srgb, var(--link) 45%, var(--bg)); background: color-mix(in srgb, var(--link) 12%, var(--bg)); }
  .reg a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .opens { display: grid; grid-template-columns: 28px 16px; column-gap: 3px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .opens span:last-child { text-align: right; }

  /* Status lights: new, old and server groups, each with a male and a female column */
  .lights { display: flex; gap: 12px; align-self: stretch; }
  .grp { display: grid; grid-template-columns: 13px 13px; column-gap: 2px; }
  .head .grp b { grid-column: 1 / -1; font-size: 10px; font-weight: 600; text-align: center; }
  .l { display: grid; place-items: center; text-align: center; }
  .l.hl { background: var(--hl); }
  .head .l.hl { color: var(--fg); }
  i.light { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; color: var(--unknown); background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .3), transparent 65%), currentColor; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12), 0 0 0 2px color-mix(in srgb, currentColor 10%, transparent); }
  i.g { color: var(--open); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1), 0 0 0 2px color-mix(in srgb, currentColor 20%, transparent); }
  i.y { color: var(--wait); }
  i.o { color: var(--long-wait); }
  i.r { color: var(--closed); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
  #list[data-as]:not([data-as=any]) .l:not(.hl) i.light { opacity: .28; }
  .l.hl i.light { width: 10px; height: 10px; }

  /* Notes */
  .notes { padding: 8px 12px 10px 38px; border-bottom: 1px solid var(--line); background: var(--notes-bg); color: var(--notes-fg); font-size: 13px; }
  .notes .meta { margin-bottom: 4px; color: var(--muted); font-size: 12px; }
  .notes p { margin: 0 0 4px; }
  .notes a { color: var(--link); }

  .empty { padding: 40px 8px; color: var(--muted); text-align: center; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 24px 32px; color: var(--faint); font-size: 12px; }

  /* Photo shown while hovering a location's name */
  #photo { position: fixed; z-index: 30; padding: 6px; border-radius: 10px; background: var(--popover-bg); box-shadow: var(--popover-shadow); pointer-events: none; }
  #photo img { display: block; width: 284px; height: 200px; border-radius: 6px; background: var(--photo-bg); object-fit: cover; }
  #photo div { max-width: 284px; padding: 6px 2px 1px; font-size: 12.5px; }
  #photo span { color: var(--muted); }

  /* Location shown while hovering a flag */
  #tip { position: fixed; z-index: 30; max-width: min(340px, calc(100vw - 16px)); overflow-wrap: anywhere; white-space: pre-line; padding: 4px 8px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 12.5px; pointer-events: none; }

  /* Narrow screens: name on the first line, details on the second, lights (labelled) on the third */
  @media (max-width: 820px) {
    .bar { position: static; }
    #filters { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 12px; padding: 12px 16px; }
    .brand { grid-column: 1 / -1; padding-right: 36px; }
    #theme { top: 12px; }
    .where-filter, .course-filter, .also-filter { grid-column: 1 / -1; }
    .where-box { flex: 1; width: auto; }
    .course-filter { align-items: start; }
    .course-filter > .filter-label { padding-top: 3px; }
    .f input:not([type=checkbox]), .f select { min-width: 0; max-width: 100%; }
    .f select { flex: 1; }
    .also-filter { flex-wrap: wrap; gap: 6px 12px; }
    .place-options { width: 100%; }
    .head { display: none; }
    h2 { top: 0; }
    .row { grid-template-columns: minmax(0, 1fr) 70px auto; grid-template-areas: "location location location" "dates type apply" "lights lights links"; gap: 6px 8px; padding: 8px; }
    [data-column=location] { grid-area: location; } [data-column=dates] { grid-area: dates; } [data-column=type] { grid-area: type; }
    [data-column=links] { grid-area: links; justify-self: end; } [data-column=apply] { grid-area: apply; justify-self: end; }
    [data-column=lights] { grid-area: lights; }
    .lights { gap: 10px; align-self: auto; flex-wrap: wrap; }
    .grp { display: flex; gap: 8px; }
    .l { display: inline-flex; gap: 4px; font-size: 11px; color: var(--muted); }
    .l:not(:empty)::after { content: attr(data-k); }
    .notes { padding-left: 12px; }
  }
  @media (max-width: 380px) {
    #filters { grid-template-columns: minmax(0, 1fr); }
    .row { grid-template-areas: "location location location" "dates type apply" "lights lights lights" ". . links"; }
  }
</style>
<script>
  // Set the theme before the page paints: the viewer's last choice, else the system's.
  {
    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch { /* storage blocked: follow the system */ }
    document.documentElement.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
</script>
</head>
<body>
<div class="bar">
  <form id="filters" autocomplete="off">
    <span class="brand">sit <small>mockup · sample data</small></span>
    <div class="f where-filter"><label for="place-search">Where</label>
      <div class="where-box" id="where-box">
        <input type="hidden" name="where">
        <span class="place-values"><span id="place-chips"></span><input type="search" id="place-search" placeholder="country, state or center" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="place-options" spellcheck="false"></span>
        <div class="place-options" id="place-options" role="listbox" aria-label="Places" hidden></div>
      </div>
    </div>
    <span class="f"><label for="from">From</label> <input type="date" name="from" id="from"></span>
    <span class="f course-filter"><span class="filter-label">Course</span> <span class="chips" id="types"></span></span>
    <span class="f"><label for="as">As</label>
      <select name="as" id="as">
        <option value="any">anyone</option>
        <option value="NM">new male</option>
        <option value="NF">new female</option>
        <option value="OM">old male</option>
        <option value="OF">old female</option>
        <option value="SM">server, male</option>
        <option value="SF">server, female</option>
      </select>
    </span>
    <span class="f"><label for="lang">Language</label> <select name="lang" id="lang"></select></span>
    <label class="f"><input type="checkbox" name="centers"> centers only</label>
    <span class="f also-filter"><span class="filter-label">Also show</span>
      <label class="f"><input type="checkbox" name="wait" checked> wait lists</label>
      <label class="f"><input type="checkbox" name="soon" checked> not open yet</label>
    </span>
    <button type="button" id="theme"></button>
  </form>
</div>

<div class="summary">
  <span id="summary"></span>
  <span class="legend">
    <span><i class="kind noncenter"></i>non-center</span>
    <span class="sep"></span>
    <span><i class="light g"></i>open</span>
    <span><i class="light y"></i>wait list</span>
    <span><i class="light o"></i>long wait list</span>
    <span><i class="light r"></i>closed</span>
  </span>
</div>
<div id="place-status" class="sr-only" role="status"></div>
<div id="column-status" class="sr-only" role="status"></div>
<main id="list"></main>
<footer>Mockup: a sample of courses from dhamma.org's course search, fetched 13 Nov 2026. Filters run on this sample in the page.</footer>

<div id="photo" hidden><img alt=""><div></div></div>
<div id="tip" hidden></div>

<script src="mockup-data.js"></script>
<script>
'use strict';

// Use the viewer's local calendar date; a UTC conversion can shift it by a day.
const now = new Date();
const TODAY = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map(m => m.slice(0, 3));

// Light columns, and which columns each status entry type fills. A status entry
// without a type covers the whole course; more specific entries win over general ones.
const COLUMNS = [['NM', 'New male'], ['NF', 'New female'], ['OM', 'Old male'], ['OF', 'Old female'], ['SM', 'Server, male'], ['SF', 'Server, female']];
const GROUPS = [['NEW', 'New students', ['NM', 'NF']], ['OLD', 'Old students', ['OM', 'OF']], ['SRV', 'Servers', ['SM', 'SF']]];
const KEYS = COLUMNS.map(([k]) => k);
const COLUMN_NAME = Object.fromEntries(COLUMNS);
const COVERS = { m: ['NM', 'OM'], w: ['NF', 'OF'], s: ['SM', 'SF'], nm: ['NM'], nw: ['NF'], om: ['OM'], ow: ['OF'], ms: ['SM'], fs: ['SF'] };
const specificity = s => (s.type == null ? 0 : s.type.length === 1 ? 1 : 2);
const LIGHTS = { Green: 'g', Yellow: 'y', Orange: 'o', Red: 'r' };

// Course types the page covers: dhamma.org's raw_course_type code, short and full name.
const TYPES = [
  ['10-Day', '10D', '10-day'],
  ['10-DayOSC', '10D OS', '10-day for old students'],
  ['10-DaySpecial', '10D SPCL', 'Special 10-day'],
  ['14-DayGratitude', '14D', '14-day gratitude course'],
  ['20-DayOSC', '20D', '20-day'],
  ['30-DayOSC', '30D', '30-day'],
  ['45-DayOSC', '45D', '45-day'],
  ['60-DayOSC', '60D', '60-day'],
  ['TSC', 'TSC', "Teacher's self course"],
  ['10-DayExecutive', 'EXEC', 'Executive course'],
  ['Satipatthana', 'STP', 'Satipaṭṭhāna Sutta course'],
  ['3-DayOSC', '3D', '3-day'],
];
const TYPE = new Map(TYPES.map(([raw, short, name]) => [raw, { short, name }]));
// Course types that take new students; the others are for old students only.
const NEW_STUDENT_TYPES = new Set(['10-Day', '10-DayExecutive']);
const LONG_TYPES = new Set(['10-DaySpecial', '20-DayOSC', '30-DayOSC', '45-DayOSC', '60-DayOSC']);
const SPECIAL_TYPES = new Set(['TSC', '14-DayGratitude', 'Satipatthana']);
const typeClass = raw => LONG_TYPES.has(raw) ? 'long' : SPECIAL_TYPES.has(raw) ? 'special' : 'regular';
const typeTip = raw => [TYPE.get(raw).name, LONG_TYPES.has(raw) ? 'Long course' : ''].filter(Boolean).join(' · ');
// Combine the two upstream 14-day codes in one filter; retain their own codes in rows.
const filterTypeCode = raw => ['14-DayGratitude', 'TSC'].includes(raw) ? '14D/TSC' : TYPE.get(raw).short;
const filterTypeTip = raw => raw === '14-DayGratitude' ? "14-day gratitude / teacher's self course" : typeTip(raw);
// Keep like-colored chips together, shortest first, with teal before violet.
const FILTER_GROUP_ORDER = { regular: 0, special: 1, long: 2 };
const filterDuration = raw => raw === 'Satipatthana' ? 8 : parseInt(raw, 10) || Infinity;
const FILTER_TYPES = TYPES.filter(([raw]) => raw !== 'TSC').map(([raw]) => [raw, filterTypeCode(raw)])
  .sort(([a], [b]) => FILTER_GROUP_ORDER[typeClass(a)] - FILTER_GROUP_ORDER[typeClass(b)] || filterDuration(a) - filterDuration(b));

const svg = paths => `<svg viewBox="0 0 24 24" aria-hidden="true">${paths}</svg>`;
const ICONS = {
  web: svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>'),
  schedule: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
  notes: svg('<path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5M9 12.5h7M9 16h5"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>'),
};

const $ = sel => document.querySelector(sel);
const form = $('#filters'), list = $('#list'), summary = $('#summary'), photo = $('#photo');
const byId = new Map(SAMPLE_COURSES.map(c => [c.id, c]));

const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
// fold lowercases and strips diacritics, so "dhara" finds "Dhamma Dharā".
const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const textOf = html => new DOMParser().parseFromString(html, 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
const flag = cc => /^[a-z]{2}$/i.test(cc || '') ? `<img src="assets/flags/${cc.toLowerCase()}.svg" alt="">` : '?';

// The Where control stores stable place keys; typing only searches suggestions.
const places = PLACES.map(([kind, id, text, texts, tag, count]) => ({
  kind, id, text, texts, tag, count, key: `${kind}_${id}`,
  search: [...texts, text].map(fold),
}));
const placeByKey = new Map(places.map(p => [p.key, p]));
const placeInput = $('#place-search'), placeOptions = $('#place-options');
const PLACE_GROUPS = [
  ['region', 'Regions'], ['state', 'States and provinces'],
  ['location', 'Centers and non-centers'], ['sublocation', 'Venues'],
];
let suggestions = [], activePlace = -1;

function chosenPlaces() {
  return [...new Set(form.elements.where.value.split(','))].map(k => placeByKey.get(k)).filter(Boolean);
}

function placeMatches(c, p) {
  const l = c.loc;
  if (p.kind === 'region') return (LOCATION_REGIONS[l.id] || []).includes(p.id);
  if (p.kind === 'location') return l.id === p.id;
  if (p.kind === 'sublocation') return l.subId === p.id;
  if (p.kind === 'state') {
    const state = p.texts[0];
    const country = p.text.slice(state.length).replace(/^,\s*/, '');
    return fold(l.state) === fold(state) && fold(l.country) === fold(country);
  }
  return false;
}

// Every word must match. Prefer an exact phrase, prefix, word starts, then substrings.
function placeRank(p, query, words) {
  if (!words.every(w => p.search.some(t => t.includes(w)))) return Infinity;
  if (p.search.includes(query)) return 0;
  if (p.search.some(t => t.startsWith(query))) return 1;
  if (words.every(w => p.search.some(t => t.split(/[^\p{L}\p{N}]+/u).some(s => s.startsWith(w))))) return 2;
  return 3;
}

// Fold each original character separately to retain its position when highlighting accents.
function highlightPlace(text, words) {
  if (!words.length) return esc(text);
  let folded = '', positions = [];
  for (let i = 0; i < text.length;) {
    const ch = String.fromCodePoint(text.codePointAt(i)), normalized = fold(ch);
    for (const ignored of normalized) positions.push([i, i + ch.length]);
    folded += normalized;
    i += ch.length;
  }
  const marked = new Set();
  for (const word of words) {
    let start = folded.indexOf(word);
    while (start !== -1) {
      for (let j = start; j < start + word.length; j++) {
        if (positions[j]) for (let k = positions[j][0]; k < positions[j][1]; k++) marked.add(k);
      }
      start = folded.indexOf(word, start + 1);
    }
  }
  let html = '', bold = false;
  for (let i = 0; i < text.length; i++) {
    const next = marked.has(i);
    if (next !== bold) html += next ? '<b>' : '</b>';
    bold = next;
    html += esc(text[i]);
  }
  return html + (bold ? '</b>' : '');
}

function renderPlaceChips() {
  const chosen = chosenPlaces();
  form.elements.where.value = chosen.map(p => p.key).join(',');
  $('#place-chips').innerHTML = chosen.map(p => `<span class="place-chip" data-tip="${esc(p.text)}"><span>${esc(p.kind === 'region' ? p.text : p.texts[0])}</span><button type="button" class="place-remove" data-remove-place="${p.key}" aria-label="${esc(`Remove ${p.text}`)}">×</button></span>`).join('');
  placeInput.placeholder = chosen.length ? 'add a place' : 'country, state or center';
}

function activatePlace(index, scroll = false) {
  activePlace = index;
  for (const option of placeOptions.querySelectorAll('[role=option]')) {
    option.setAttribute('aria-selected', String(+option.dataset.index === index));
  }
  const option = placeOptions.querySelector(`[data-index="${index}"]`);
  if (option) {
    placeInput.setAttribute('aria-activedescendant', option.id);
    if (scroll) option.scrollIntoView({ block: 'nearest' });
  } else placeInput.removeAttribute('aria-activedescendant');
}

function showPlaces() {
  const query = fold(placeInput.value.trim()), words = query.split(/\s+/).filter(Boolean);
  const chosen = new Set(chosenPlaces().map(p => p.key));
  const ranked = places.filter(p => !chosen.has(p.key) && (words.length || p.tag === 'continent'))
    .map(p => ({ p, rank: words.length ? placeRank(p, query, words) : 0 }))
    .filter(item => Number.isFinite(item.rank))
    .sort((a, b) => a.rank - b.rank || (a.p.kind === 'region' ? 0 : 1) - (b.p.kind === 'region' ? 0 : 1)
      || (a.p.kind === 'region' && b.p.kind === 'region' ? b.p.count - a.p.count : 0) || a.p.text.localeCompare(b.p.text));
  suggestions = [];
  placeOptions.innerHTML = PLACE_GROUPS.map(([kind, label]) => {
    const group = ranked.filter(item => item.p.kind === kind);
    if (!group.length) return '';
    const options = group.slice(0, 8).map(({ p }) => {
      const index = suggestions.push(p) - 1;
      return `<div class="place-option" id="place-option-${p.key}" role="option" aria-selected="false" data-index="${index}"><span>${highlightPlace(p.text, words)}</span><span class="place-tag">${esc(p.tag)}${p.kind === 'region' ? `<br>${p.count} location${p.count === 1 ? '' : 's'}` : ''}</span></div>`;
    }).join('');
    return `<div role="group" aria-label="${label}"><div class="place-group" aria-hidden="true">${label}</div>${options}${group.length > 8 ? `<div class="place-more">${group.length - 8} more — keep typing</div>` : ''}</div>`;
  }).join('') || '<div class="place-empty">No matching places.</div>';
  placeOptions.hidden = false;
  placeInput.setAttribute('aria-expanded', 'true');
  activatePlace(suggestions.length ? 0 : -1);
  const r = $('#where-box').getBoundingClientRect();
  placeOptions.style.left = Math.min(0, innerWidth - r.left - placeOptions.offsetWidth - 16) + 'px';
  $('#place-status').textContent = `${ranked.length} place${ranked.length === 1 ? '' : 's'} found${ranked.length > suggestions.length ? `, ${suggestions.length} shown. Keep typing to narrow the list` : ''}.`;
}

function closePlaces() {
  placeOptions.hidden = true;
  placeInput.setAttribute('aria-expanded', 'false');
  placeInput.removeAttribute('aria-activedescendant');
  activePlace = -1;
}

function changePlaces(keys) {
  form.elements.where.value = keys.join(',');
  renderPlaceChips();
  render();
}

function pickPlace(p) {
  if (!p) return;
  changePlaces([...chosenPlaces().map(p => p.key), p.key]);
  placeInput.value = '';
  placeInput.focus();
  closePlaces();
  $('#place-status').textContent = `${p.text} added.`;
}

placeInput.addEventListener('focus', showPlaces);
placeInput.addEventListener('input', e => { e.stopPropagation(); showPlaces(); });
placeInput.addEventListener('keydown', e => {
  if (e.isComposing) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (placeOptions.hidden) { showPlaces(); return; }
    if (suggestions.length) activatePlace((activePlace + (e.key === 'ArrowDown' ? 1 : -1) + suggestions.length) % suggestions.length, true);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (!placeOptions.hidden) pickPlace(suggestions[activePlace]);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closePlaces();
  } else if (e.key === 'Backspace' && !placeInput.value && chosenPlaces().length) {
    e.preventDefault();
    const chosen = chosenPlaces(), removed = chosen.pop();
    changePlaces(chosen.map(p => p.key));
    showPlaces();
    $('#place-status').textContent = `${removed.text} removed.`;
  }
});
placeOptions.addEventListener('pointerdown', e => { if (e.target.closest('[role=option]')) e.preventDefault(); });
placeOptions.addEventListener('click', e => {
  const option = e.target.closest('[role=option]');
  if (option) pickPlace(suggestions[+option.dataset.index]);
});
placeOptions.addEventListener('mousemove', e => {
  const option = e.target.closest('[role=option]');
  if (option && +option.dataset.index !== activePlace) activatePlace(+option.dataset.index);
});
$('#place-chips').addEventListener('click', e => {
  const button = e.target.closest('[data-remove-place]');
  if (!button) return;
  changePlaces(chosenPlaces().filter(p => p.key !== button.dataset.removePlace).map(p => p.key));
  placeInput.focus();
  showPlaces();
});
$('#where-box').addEventListener('focusout', e => { if (!e.currentTarget.contains(e.relatedTarget)) closePlaces(); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#where-box')) closePlaces(); });

// Desktop headings and rows use the same order and track widths. Phone rows use named areas.
const DISPLAY_COLUMNS = {
  location: { label: 'Location', width: 'minmax(0, 1fr)' },
  dates: { label: 'Dates', width: '120px' },
  type: { label: 'Type', width: '84px' },
  lights: { label: 'Availability', width: '108px' },
  apply: { label: 'Apply', width: '84px' },
  links: { label: 'Links', width: '48px' },
};
let columnOrder = Object.keys(DISPLAY_COLUMNS);
try {
  const saved = JSON.parse(localStorage.getItem('sit.columns'));
  if (Array.isArray(saved) && saved.length === columnOrder.length && new Set(saved).size === columnOrder.length && saved.every(k => Object.hasOwn(DISPLAY_COLUMNS, k))) columnOrder = saved;
} catch { /* blocked storage or an invalid saved order: use the default */ }

function saveColumnOrder(next, moved) {
  columnOrder = next;
  try { localStorage.setItem('sit.columns', JSON.stringify(next)); } catch { /* lasts until reload */ }
  render();
  list.querySelector(`.column-head[data-column="${moved}"]`)?.focus({ preventScroll: true });
  $('#column-status').textContent = `${DISPLAY_COLUMNS[moved].label} moved to column ${next.indexOf(moved) + 1} of ${next.length}.`;
}

let draggedColumn = null;
function clearDrag() {
  for (const el of list.querySelectorAll('.column-head')) { delete el.dataset.drop; el.classList.remove('dragging'); }
}
list.addEventListener('dragstart', e => {
  const heading = e.target.closest('.column-head');
  if (!heading) return;
  draggedColumn = heading.dataset.column;
  e.dataTransfer.setData('text/plain', draggedColumn);
  e.dataTransfer.effectAllowed = 'move';
  heading.classList.add('dragging');
  hideTip();
});
list.addEventListener('dragover', e => {
  const heading = e.target.closest('.column-head');
  if (!heading || !draggedColumn) return;
  e.preventDefault();
  for (const el of list.querySelectorAll('[data-drop]')) delete el.dataset.drop;
  if (heading.dataset.column === draggedColumn) return;
  const r = heading.getBoundingClientRect();
  heading.dataset.drop = e.clientX < r.left + r.width / 2 ? 'before' : 'after';
  e.dataTransfer.dropEffect = 'move';
});
list.addEventListener('dragleave', e => {
  const heading = e.target.closest('.column-head');
  if (heading && !heading.contains(e.relatedTarget)) delete heading.dataset.drop;
});
list.addEventListener('drop', e => {
  const heading = e.target.closest('.column-head');
  if (!heading || !draggedColumn) return;
  e.preventDefault();
  const moved = draggedColumn, side = heading.dataset.drop, target = heading.dataset.column;
  clearDrag();
  draggedColumn = null;
  if (moved === target || !side) return;
  const next = columnOrder.filter(k => k !== moved);
  next.splice(next.indexOf(target) + (side === 'after' ? 1 : 0), 0, moved);
  saveColumnOrder(next, moved);
});
list.addEventListener('dragend', () => { clearDrag(); draggedColumn = null; });
list.addEventListener('keydown', e => {
  const heading = e.target.closest('.column-head');
  if (!heading || !e.altKey || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  const key = heading.dataset.column, index = columnOrder.indexOf(key);
  const destination = index + (e.key === 'ArrowLeft' ? -1 : 1);
  if (destination < 0 || destination >= columnOrder.length) return;
  const next = [...columnOrder];
  [next[index], next[destination]] = [next[destination], next[index]];
  saveColumnOrder(next, key);
});

const ymd = s => s.split('-').map(Number);
// dateRange leaves out the year, which the month headings show: "Nov 18 – 29", "Nov 25 – Dec 6".
// The end is faded so the start date stands out.
function dateRange(a, b) {
  const [, am, ad] = ymd(a), [, bm, bd] = ymd(b);
  const start = `${MON[am - 1]} ${ad}`;
  if (a === b) return start;
  return `${start}<span class="end"> – ${am === bm ? bd : `${MON[bm - 1]} ${bd}`}</span>`;
}
function longDate(s) {
  const [y, m, d] = ymd(s);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}

// lights maps each light column to the status entry that applies to it.
function lights(c) {
  const cells = {};
  for (const s of [...c.status].sort((a, b) => specificity(a) - specificity(b))) {
    for (const k of COVERS[s.type] || KEYS) cells[k] = s;
  }
  if (!NEW_STUDENT_TYPES.has(c.type)) {
    delete cells.NM;
    delete cells.NF;
  }
  return cells;
}

const opensLater = c => c.enroll > TODAY || c.status.some(s => /^applications accepted/i.test(s.status));

// availability says whether someone matching f can sign up: 'open', 'soon'
// (registration opens later) or '' (full, closed or in progress).
function availability(c, f) {
  if (opensLater(c)) return f.soon ? 'soon' : '';
  const cells = lights(c);
  const ok = s => s && (s.color === 'Green' || (f.wait && (s.color === 'Yellow' || s.color === 'Orange')));
  return (f.as === 'any' ? KEYS : [f.as]).some(k => ok(cells[k])) ? 'open' : '';
}

function matches(c, f) {
  if (c.start < f.from) return false;
  if (!TYPE.has(c.type) || (f.types && !f.types.split(',').includes(filterTypeCode(c.type)))) return false;
  if (f.centers && !c.loc.center) return false;
  if (f.lang && !c.langs.includes(f.lang)) return false;
  if (f.where) return f.where.split(',').some(key => placeByKey.has(key) && placeMatches(c, placeByKey.get(key)));
  return true;
}

// Filters live in the form and in the URL fragment, so a search can be bookmarked or shared.
const DEFAULTS = { where: '', from: TODAY, types: '', as: 'any', lang: '', centers: false, wait: true, soon: true };
// The course types are a set of checkboxes, kept as a comma-separated list of short names.
function readFilters() {
  const f = {};
  for (const [k, d] of Object.entries(DEFAULTS)) {
    f[k] = k === 'types' ? [...form.querySelectorAll('[name=types]:checked')].map(i => i.value).join(',')
      : typeof d === 'boolean' ? form.elements[k].checked : form.elements[k].value;
  }
  return f;
}
function setFilters(f) {
  const types = new Set(f.types.split(',').map(code => ['14D', 'TSC'].includes(code) ? '14D/TSC' : code));
  for (const i of form.querySelectorAll('[name=types]')) i.checked = types.has(i.value);
  for (const [k, d] of Object.entries(DEFAULTS)) {
    if (k === 'types') continue;
    if (typeof d === 'boolean') form.elements[k].checked = f[k];
    else form.elements[k].value = f[k];
  }
  renderPlaceChips();
  placeInput.value = '';
  closePlaces();
}
function toFragment(f) {
  const p = new URLSearchParams();
  for (const [k, d] of Object.entries(DEFAULTS)) if (f[k] !== d) p.set(k, typeof d === 'boolean' ? (f[k] ? '1' : '0') : f[k]);
  return p.toString();
}
function fromFragment() {
  const p = new URLSearchParams(location.hash.slice(1)), f = { ...DEFAULTS };
  for (const [k, d] of Object.entries(DEFAULTS)) if (p.has(k)) f[k] = typeof d === 'boolean' ? p.get(k) === '1' : p.get(k);
  return f;
}

const link = (href, label, icon) => href ? `<a class="icon" href="${esc(href)}" target="_blank" rel="noopener" data-tip="${label}" aria-label="${label}">${icon}</a>` : '<span></span>';

function rowHTML(c, avail, f) {
  const l = c.loc;
  const statuses = avail === 'soon' ? {} : lights(c);
  const reg = avail === 'soon'
    ? `<span class="opens" data-tip="Registration opens ${esc(longDate(c.enroll))}"><span>${MON[ymd(c.enroll)[1] - 1]}</span><span>${ymd(c.enroll)[2]}</span></span>`
    : `<a href="${esc(c.apply)}" target="_blank" rel="noopener" aria-label="${esc(`Apply for ${TYPE.get(c.type).name} at ${l.name}, ${longDate(c.start)}`)}">Apply</a>`;
  const cell = k => {
    const s = statuses[k], hl = k === f.as ? ' hl' : '';
    return s
      ? `<span class="l${hl}" data-k="${k}" data-tip="${esc(`${COLUMN_NAME[k]}: ${s.status}`)}"><i class="light ${LIGHTS[s.color] || ''}"></i></span>`
      : `<span class="l${hl}" data-k="${k}"></span>`;
  };
  const lightCells = GROUPS.map(([, , keys]) => `<span class="grp">${keys.map(cell).join('')}</span>`).join('');
  const cells = {
    location: `<span class="who" data-column="location"><span class="flag" role="img" aria-label="${esc(l.venue ? `${l.venue}, ${l.place}` : l.place)}" data-tip="${esc(l.venue ? `${l.venue}\n${l.place}` : l.place)}">${flag(l.cc)}</span>${l.web ? `<a class="name" href="${esc(l.web)}" target="_blank" rel="noopener"${l.photo ? ` data-photo="${esc(l.photo)}"` : ''}>${esc(l.name.replace(/^Dhamma\s+/, ''))}</a>` : `<span class="name"${l.photo ? ` data-photo="${esc(l.photo)}"` : ''}>${esc(l.name.replace(/^Dhamma\s+/, ''))}</span>`}${l.center ? '' : '<span class="kind noncenter" data-tip="non-center"></span>'}</span>`,
    dates: `<span class="dates" data-column="dates" data-tip="${esc(`${longDate(c.start)} – ${longDate(c.end)}`)}">${dateRange(c.start, c.end)}</span>`,
    type: `<span class="type" data-column="type"><span class="type-code ${typeClass(c.type)}" data-tip="${esc(`${typeTip(c.type)}\n${c.langs.join(', ')}`)}">${esc(TYPE.get(c.type).short)}</span></span>`,
    lights: `<span class="lights" data-column="lights">${lightCells}</span>`,
    apply: `<span class="reg" data-column="apply">${reg}</span>`,
    links: `<span class="links" data-column="links">${link(l.schedule, 'Course schedule', ICONS.schedule)}${c.hasNotes ? `<button type="button" class="icon note" data-tip="Notes" aria-label="Notes" aria-expanded="false">${ICONS.notes}</button>` : ''}</span>`,
  };
  return `<div class="row" data-id="${c.id}">${columnOrder.map(key => cells[key]).join('')}</div>`;
}

function headHTML(f) {
  const cols = GROUPS.map(([label, title, keys]) => `<span class="grp"><b data-tip="${title}">${label}</b>${keys.map(k =>
    `<span class="l${k === f.as ? ' hl' : ''}" data-tip="${COLUMN_NAME[k]}">${k.slice(-1)}</span>`).join('')}</span>`).join('');
  return `<div class="row head">${columnOrder.map(key => {
    const label = DISPLAY_COLUMNS[key].label;
    return `<button type="button" class="column-head${key === 'lights' ? ' lights' : ''}" data-column="${key}" draggable="true" aria-label="${label}. Drag to reorder, or use Alt and left or right arrow." aria-keyshortcuts="Alt+ArrowLeft Alt+ArrowRight" data-tip="${label}\nDrag to reorder · Alt + ← / →">${key === 'lights' ? cols : esc(label)}</button>`;
  }).join('')}</div>`;
}

const openNotes = new Set();

function render() {
  hidePhoto();
  hideTip();
  list.style.setProperty('--columns', columnOrder.map(k => DISPLAY_COLUMNS[k].width).join(' '));
  const f = readFilters();
  list.dataset.as = f.as;
  try { history.replaceState(null, '', '#' + toFragment(f)); } catch { /* not allowed for some file:// URLs */ }

  const shown = [];
  for (const c of SAMPLE_COURSES) {
    if (!matches(c, f)) continue;
    const avail = availability(c, f);
    if (avail) shown.push([c, avail]);
  }
  shown.sort(([a], [b]) => a.start.localeCompare(b.start) || a.loc.name.localeCompare(b.loc.name));

  const months = new Map();
  for (const item of shown) {
    const key = item[0].start.slice(0, 7);
    if (!months.has(key)) months.set(key, []);
    months.get(key).push(item);
  }
  list.innerHTML = shown.length
    ? headHTML(f) + [...months].map(([key, items]) => {
        const [y, m] = ymd(key);
        return `<h2>${y} ${MONTHS[m - 1]}<span class="count">${items.length}</span></h2>${items.map(([c, avail]) => rowHTML(c, avail, f)).join('')}`;
      }).join('')
    : '<p class="empty">No courses you can sign up for match these filters.</p>';
  // Month headings stick just below the column headings.
  document.documentElement.style.setProperty('--head-h', (list.querySelector('.head')?.getBoundingClientRect().height ?? 0) + 'px');
  for (const id of openNotes) {
    const row = list.querySelector(`.row[data-id="${id}"]`);
    if (row) toggleNotes(row, true);
  }

  summary.innerHTML = `<b>${shown.length}</b> course${shown.length === 1 ? '' : 's'} you can sign up for`;
}

// Notes: the location's comments, sanitized to a few harmless tags.
const KEEP = new Set(['p', 'br', 'b', 'strong', 'i', 'em', 'u', 'ul', 'ol', 'li', 'a']);
function sanitize(html) {
  const out = document.createDocumentFragment();
  (function copy(from, to) {
    for (const n of from.childNodes) {
      if (n.nodeType === Node.TEXT_NODE) { to.append(n.data); continue; }
      if (n.nodeType !== Node.ELEMENT_NODE || n.localName === 'script' || n.localName === 'style') continue;
      if (!KEEP.has(n.localName)) { copy(n, to); continue; }
      const el = document.createElement(n.localName);
      if (n.localName === 'a') {
        try {
          const u = new URL(n.getAttribute('href') || '', 'https://www.dhamma.org');
          if (['http:', 'https:', 'mailto:'].includes(u.protocol)) Object.assign(el, { href: u.href, target: '_blank', rel: 'noopener' });
        } catch { /* leave the link text without a link */ }
      }
      copy(n, el);
      to.append(el);
    }
  })(new DOMParser().parseFromString(html, 'text/html').body, out);
  return out;
}

const squash = s => fold(s).replace(/courses?|[^a-z0-9]/g, '');
function toggleNotes(row, open) {
  const c = byId.get(+row.dataset.id), btn = row.querySelector('.note');
  const panel = row.nextElementSibling?.classList.contains('notes') ? row.nextElementSibling : null;
  open ??= !panel;
  btn?.setAttribute('aria-expanded', String(open));
  if (!open) { panel?.remove(); openNotes.delete(c.id); return; }
  openNotes.add(c.id);
  if (panel) return;
  const label = textOf(c.label);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = [
    label && squash(label) !== squash(TYPE.get(c.type).name) ? `Listed as “${label}”` : '',
    c.langs.join(', '),
  ].filter(Boolean).join(' · ');
  const notes = document.createElement('div');
  notes.className = 'notes';
  notes.append(meta, sanitize(c.comments));
  row.after(notes);
}

// Photo popover for location names.
let photoFor = null;
function showPhoto(name) {
  const c = byId.get(+name.closest('.row').dataset.id);
  const img = new Image(284, 200);
  img.alt = '';
  img.onerror = hidePhoto;
  img.src = c.loc.photo;
  photo.querySelector('img').replaceWith(img);
  photo.querySelector('div').innerHTML = `<b>${esc(c.loc.name)}</b>${c.loc.meaning ? ` <span>· ${esc(c.loc.meaning)}</span>` : ''}`;
  photo.hidden = false;
  const r = name.getBoundingClientRect(), h = photo.offsetHeight, w = photo.offsetWidth;
  photo.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  photo.style.top = (r.bottom + 6 + h < innerHeight ? r.bottom + 6 : Math.max(8, r.top - 6 - h)) + 'px';
  photoFor = name;
}
function hidePhoto() {
  photo.hidden = true;
  photoFor = null;
}
// Tooltips for anything with a data-tip attribute, shown at once (native titles lag or don't show).
const tip = $('#tip');
let tipFor = null;
function showTip(el) {
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - tip.offsetWidth - 8)) + 'px';
  tip.style.top = (r.bottom + 6 + h < innerHeight ? r.bottom + 6 : r.top - 6 - h) + 'px';
  tipFor = el;
}
function hideTip() {
  tip.hidden = true;
  tipFor = null;
}

document.addEventListener('mouseover', e => {
  const name = e.target.closest('.name[data-photo]');
  if (name && name !== photoFor) showPhoto(name);
  const el = e.target.closest('[data-tip]');
  if (el && el !== tipFor) showTip(el);
});
document.addEventListener('mouseout', e => {
  if (photoFor && !photoFor.contains(e.relatedTarget)) hidePhoto();
  if (tipFor && !tipFor.contains(e.relatedTarget)) hideTip();
});
addEventListener('scroll', () => { hidePhoto(); hideTip(); }, { passive: true });

list.addEventListener('click', e => {
  const btn = e.target.closest('.note');
  if (btn) toggleNotes(btn.closest('.row'));
});

let timer;
form.addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(render, e.target.type === 'search' ? 200 : 0);
});
form.addEventListener('submit', e => e.preventDefault());
addEventListener('hashchange', () => { setFilters(fromFragment()); render(); });

// Keep the column header row just below the filter bar while scrolling.
const measureHeaders = () => {
  // Preserve fractional pixels, and overlap sticky layers by 1px to prevent scroll-through seams.
  document.documentElement.style.setProperty('--bar-h', $('.bar').getBoundingClientRect().height + 'px');
  document.documentElement.style.setProperty('--head-h', (list.querySelector('.head')?.getBoundingClientRect().height ?? 0) + 'px');
};
const layoutObserver = new ResizeObserver(measureHeaders);
layoutObserver.observe($('.bar'));
layoutObserver.observe(list);

// Theme switch. The choice is remembered in this browser; without one the page follows the system.
const themeButton = $('#theme');
function showThemeButton() {
  const dark = document.documentElement.dataset.theme === 'dark';
  themeButton.innerHTML = dark ? ICONS.sun : ICONS.moon;
  const label = dark ? 'Switch to light theme' : 'Switch to dark theme';
  themeButton.dataset.tip = label;
  themeButton.setAttribute('aria-label', label);
}
themeButton.addEventListener('click', () => {
  const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('theme', theme); } catch { /* the choice lasts until reload */ }
  showThemeButton();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch { /* no saved choice */ }
  if (!saved) {
    document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
    showThemeButton();
  }
});
showThemeButton();

// Start: notes flags, the language list and place suggestions come from the data.
for (const c of SAMPLE_COURSES) c.hasNotes = textOf(c.comments) !== '';
$('#types').innerHTML = FILTER_TYPES.map(([raw, short]) =>
  `<label class="chip ${typeClass(raw)}" data-tip="${esc(filterTypeTip(raw))}"><input type="checkbox" name="types" value="${esc(short)}"><span>${esc(short)}</span></label>`).join('');
form.elements.lang.innerHTML = '<option value="">any</option>'
  + [...new Set(SAMPLE_COURSES.flatMap(c => c.langs))].sort().map(l => `<option>${esc(l)}</option>`).join('');
setFilters(fromFragment());
render();
</script>
</body>
</html>
